name: Build Unsigned InstallerX

# Sự kiện workflow_dispatch cho phép tạo form nhập liệu thủ công trên GitHub
on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'Nhập Package Name (Application ID)'
        required: true
        default: 'com.hypertn.installer'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thiết lập Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cấp quyền thực thi cho gradlew
      run: chmod +x gradlew

    - name: Build ứng dụng (Unsigned Release)
      # Lệnh build sẽ kết hợp Flavor (Online + Stable) và Build Type (Release)
      # Tham số -PAPP_ID lấy trực tiếp dữ liệu bạn nhập từ giao diện GitHub
      run: ./gradlew assembleOnlineStableRelease -PAPP_ID="${{ github.event.inputs.app_id }}"

    - name: Đóng gói và lưu file APK
      uses: actions/upload-artifact@v4
      with:
        # Tên file tải về sẽ đính kèm luôn package name để bạn dễ phân biệt
        name: InstallerX-Unsigned-${{ github.event.inputs.app_id }}
        path: app/build/outputs/apk/**/*.apk
